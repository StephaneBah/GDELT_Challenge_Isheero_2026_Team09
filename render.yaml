services:
  - type: web
    name: echo-media
    runtime: python
    rootDir: echo_media/api
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_PATH
        value: ../data/GDELT_events_benin_2025_cleaned.csv
    plan: free
