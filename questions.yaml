# Manifest des questions de recherche — Bénin Insights
#
# Convention :
#   - Chaque question correspond à un module Python (champ `module`) exposant
#     une variable `QUESTION` qui implémente le protocole `Question`
#     (voir `src/questions/base.py`).
#   - Le manifest sert de DOCUMENTATION et de NAVIGATION (README, dashboard).
#     Il NE pilote PAS l'exécution : c'est le runner qui importe et lance
#     les modules. Lire `docs/04_architecture.md` pour la justification.
#
# Status acceptés :
#   draft        — formulation actée, code à écrire
#   in_progress  — code en développement
#   validated    — résultats validés et prêts pour le pitch / dashboard

version: 1

# Filtres globaux par défaut
defaults:
  filters:
    confidence: large
    countries: ["BN"]

questions:

  - id: Q1
    module: src.questions.q1_terrain
    title: "Le terrain"
    public_title: "Risque sécuritaire départemental"
    owner: data_analyst
    status: in_progress
    public_audience:
      - ong_operationnelles
      - presse_securite
      - ambassades
    summary: >
      Distribution du risque sécuritaire opérationnel département par
      département au Bénin sur 2025, comparée aux régions frontalières
      du Burkina Faso et du Niger. Mesure de la sous-couverture
      médiatique relative.
    default_filters:
      risk_domains: [securitaire]
      countries: [BN, UV, NG]
    primitives_used:
      analytics:
        - aggregate.by_admin1
        - aggregate.by_country
        - aggregate.time_series
        - aggregate.filter_period
        - aggregate.confidence_filter
        - aggregate.domain_filter
      ml: []
      viz:
        - maps.choropleth_benin
        - timeseries.multi_line
    outputs:
      figures:
        - choropleth_benin
        - country_comparison
      tables:
        - by_dept
        - by_country
        - mentions_by_country
    insight_template: >
      Sur la période, le Bénin a enregistré {n_events_benin} events
      sécuritaires, soit {ratio_benin_vs_burkina_pct}% de l'intensité
      observée au Burkina Faso. Top départements : {top_dept_1} et
      {top_dept_2}. Sous-couverture médiatique :
      {coverage_ratio_benin_vs_burkina}× moins de mentions par event.

  - id: Q2
    module: src.questions.q2_tone
    title: "Le ton"
    public_title: "Évolution du ton par domaine de risque"
    owner: ml_engineer
    status: in_progress
    public_audience:
      - chercheurs
      - journalistes
      - communicants_institutionnels
    summary: >
      Évolution du ton médiatique mondial sur le Bénin, par domaine
      de risque (sécuritaire, économique, sanitaire, politique).
      Détection des points de bascule (PELT) et attribution aux
      stories dominantes des 7 jours précédents.
    default_filters:
      countries: [BN]
    primitives_used:
      analytics:
        - aggregate.filter_period
        - aggregate.confidence_filter
        - aggregate.domain_filter
        - change_points.smooth_tone
        - change_points.detect_breakpoints
      ml:
        - sentiment.score_titles  # validation croisée AvgTone vs xlm-roberta
      viz:
        - timeseries.line_with_breakpoints
        - timeseries.multi_line
    outputs:
      figures:
        - tone_global
        - tone_by_domain
      tables:
        - ruptures
    insight_template: >
      Le ton mondial sur le Bénin connaît {n_ruptures_global} ruptures
      sur la période, dérive globale de {delta_tone_global} points.
      Domaine le plus dégradé : {worst_domain}. Les ruptures sont
      attribuables à des stories identifiables dans la table `ruptures`.

  - id: Q3
    module: src.questions.q3_network
    title: "Le réseau"
    public_title: "Recomposition diplomatique observable"
    owner: data_scientist
    status: in_progress
    public_audience:
      - decideurs_publics
      - chercheurs_relations_internationales
      - cellules_veille_diplomatique
    summary: >
      Réseau d'acteurs (États, organisations, personnalités) apparaissant
      aux côtés du Bénin dans la presse mondiale. Comparaison pré et post
      juillet 2023 (rupture CEDEAO/AES). Détection de communautés via
      Louvain et identification des acteurs gagnants/perdants.
    default_filters:
      countries: []  # pas de filtre pays — on veut le contexte mondial
    primitives_used:
      analytics:
        - aggregate.co_occurrence
        - aggregate.filter_period
        - aggregate.confidence_filter
        - network_ops.build_actor_graph
        - network_ops.detect_communities
        - network_ops.degree_variation
      ml: []
      viz:
        - network.force_layout_graph
    outputs:
      figures:
        - network_global
      tables:
        - co_occurrences
        - degree_variation
    insight_template: >
      Le réseau diplomatique observable du Bénin compte {n_actors}
      acteurs distincts en {n_communities} communautés. Plus grand
      gagnant post-juillet 2023 : {winners_post_2023[0].node}.
      Plus grand perdant : {losers_post_2023[0].node}.

  - id: Q4
    module: src.questions.q4_attractivity
    title: "L'attractivité"
    public_title: "Signaux de coopération et d'investissement"
    owner: data_scientist
    status: validated
    public_audience:
      - investisseurs
      - decideurs_publics
      - partenaires_developpement
      - chambres_commerce
    summary: >
      Analyse des signaux médiatiques positifs (coopération verbale et
      matérielle, diplomatie, aide) pour mesurer l'attractivité du Bénin
      sur 2025. Identification des top partenaires économiques et
      diplomatiques, des acteurs économiques impliqués (entreprises,
      IGO, agences de développement) et de l'évolution mensuelle.
    default_filters:
      countries: [BN]
    primitives_used:
      analytics:
        - aggregate.filter_period
        - aggregate.confidence_filter
      ml: []
      viz:
        - plotly bar chart partenaires
        - plotly line tendance mensuelle
        - plotly pie profil quad
    outputs:
      figures:
        - partenaires_coop
        - tendance_mensuelle
        - profil_quad
      tables:
        - top_partenaires_cooperation
        - acteurs_economiques
    insight_template: >
      Sur la période, {pct_coop}% des événements GDELT impliquant le
      Bénin relèvent de la coopération. {top_partner} est le premier
      partenaire. Pic de signaux en {peak_month}.
