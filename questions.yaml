# Manifest des questions de recherche — Bénin Risk Map
#
# Convention :
#   - Chaque question correspond à un module `src/questions/<id>.py` exposant
#     une variable `QUESTION` qui implémente le protocole `Question` (voir
#     `src/questions/base.py`).
#   - Le manifest sert de DOCUMENTATION et de NAVIGATION (README, dashboard).
#     Il NE pilote PAS l'exécution : c'est le runner CLI qui importe et lance
#     les modules. Lire `docs/04_architecture.md` pour la justification.
#   - Une question peut être déclarée `status: draft` (placeholder, code pas
#     encore écrit) tant que l'équipe n'a pas commencé l'analyse.
#
# Status acceptés :
#   draft        — formulation actée, code à écrire
#   in_progress  — code en développement, ne pas se baser dessus pour le pitch
#   validated    — résultats validés et prêts pour le pitch / dashboard

version: 1

# Filtres globaux par défaut. Une question peut les surcharger dans son champ
# `default_filters`. Le runner CLI peut aussi les surcharger en argument.
defaults:
  filters:
    confidence: large
    countries: ["BC"]

# Liste des questions actives.
# (Vide pour l'instant — l'équipe ajoutera Q1, Q2, Q3 quand elle commencera
# l'analyse. Voir le template ci-dessous pour la structure d'une entrée.)
questions: []

